    <script>
        function sendEmail(event) {
            event.preventDefault();

            // Lấy các giá trị từ form
            const subject = document.getElementById('subject').value;
            const fromEmail = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            const date = document.getElementById('hire-date').value;

            // Tạo nội dung email
            let body = `Nội dung: ${message}\n\n`;
            body += `Email người gửi: ${fromEmail}\n`;
            if (date) {
                body += `Thời gian: ${date}\n`;
            }

            // Mã hóa nội dung email để sử dụng trong URL
            const encodedSubject = encodeURIComponent(`[Website] ${subject}`);
            const encodedBody = encodeURIComponent(body);

            // Tạo liên kết mailto
            const mailtoLink = `mailto:info@longgilstudio.com?subject=${encodedSubject}&body=${encodedBody}`;

            // Mở trình soạn email mặc định
            window.location.href = mailtoLink;

            // Thông báo thành công
            alert('Email đang được mở trong ứng dụng mail của bạn!');

            // Reset form
            document.getElementById('contactForm').reset();

            // Reset giá trị dropdown menu về mặc định (nếu cần)
            document.getElementById('subject').value = 'Cá nhân';

            // Focus về ô Email để tiện nhập liệu mới
            document.getElementById('email').focus();
        }

        // Language toggle functionality
        let currentLanguage = 'vi';

        function toggleLanguage() {
            currentLanguage = currentLanguage === 'vi' ? 'en' : 'vi';

            // Update all elements with data-vi and data-en attributes
            const elements = document.querySelectorAll('[data-vi][data-en]');
            elements.forEach(element => {
                const newText = element.getAttribute(`data-${currentLanguage}`);
                if (newText) {
                    if (element.tagName === 'OPTION') {
                        element.textContent = newText;
                    } else {
                        element.innerHTML = newText;
                    }
                }
            });

            // Update both toggle buttons (mobile and desktop)
            const toggleBtnMobile = document.getElementById('langToggleMobile');
            const toggleBtnDesktop = document.getElementById('langToggleDesktop');
            const buttonText = currentLanguage === 'vi' ? '🌐 VI' : '🌐 EN';

            if (toggleBtnMobile) toggleBtnMobile.innerHTML = buttonText;
            if (toggleBtnDesktop) toggleBtnDesktop.innerHTML = buttonText;

            // Save language preference
            localStorage.setItem('preferredLanguage', currentLanguage);
        }

        // Load saved language preference immediately
        (function () {
            const savedLanguage = localStorage.getItem('preferredLanguage') || 'en';
            if (savedLanguage !== currentLanguage) {
                toggleLanguage();
            }
        })();
    </script>
